# English bug-report form collecting the same device, mapping, environment, and diagnostic evidence as the Chinese form.
# Privacy guidance is placed at entry because rules and event traces may expose input content or device identity.
name: Bug report (English)
description: Report a reproducible mapping error, device mistake, CLI failure, or UI problem
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Upgrade to the latest release and read the README, security and capability boundaries, and migration notes first.
        Rules, events, and diagnostics may contain input content, application or window identity, derived device identifiers, or local paths. Redact them before posting. Use private vulnerability reporting for unresolved security issues.

  - type: input
    id: version
    attributes:
      label: Assistant version
      description: Find it in About, the diagnostics bundle, or the release VERSION file.
      placeholder: For example, 0.1.0
    validations:
      required: true

  - type: dropdown
    id: distribution
    attributes:
      label: Distribution
      options:
        - Complete GitHub Release portable package
        - AutoHotkey source
        - Self-built EXE
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows environment
      description: Include Windows edition, feature version, OS build, and architecture.
      placeholder: For example, Windows 11 24H2 (26100.4652) x64
    validations:
      required: true

  - type: input
    id: display
    attributes:
      label: Display environment
      description: For UI defects, include scale, resolution, monitor count, and the affected monitor. Write Not applicable otherwise.
      placeholder: For example, 300% scale, 3840×2160, one monitor
    validations:
      required: true

  - type: dropdown
    id: affected_area
    attributes:
      label: Affected area
      options:
        - Keyboard source or mapped output
        - Mouse source or mapped output
        - Chord, sequence, hold, repeat, or timing
        - Device identity, rebinding, removal, or system resume
        - Application, window, variable condition, or scope
        - Capture, rule editing, import/export, or history
        - CLI, input-worker, startup, reload, or tray
        - Other UI, documentation, or release-package problem
    validations:
      required: true

  - type: textarea
    id: devices
    attributes:
      label: Physical-device environment
      description: List keyboard and mouse counts, connection types, and whether only one device is affected. Redact interface paths, serial numbers, and stable_id values.
      placeholder: For example, two USB keyboards and one Bluetooth mouse; only the second keyboard is affected.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Mapping and runtime context
      description: State source and target inputs, conditions or scope, target application and privilege, single-process diagnostic mode, and relevant non-default settings. A redacted minimal RuleSpec or package fragment is welcome.
      placeholder: For example, hold LCtrl from device A to add F23 in an unelevated target; default two-process mode.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Shortest reproduction
      description: Start from launching the assistant or opening the relevant window and list the shortest reliable sequence.
      placeholder: |
        1. Start ...
        2. Select or capture ...
        3. On device ..., enter ...
        4. Observe ...
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Every time
        - Often
        - Occasionally
        - Once
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Describe input, additive output, device state, UI, error, process, or data changes; do not write only “does not work.”
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: Describe the correct status or outcome within the project's documented Raw Input capability boundary.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Rules, events, diagnostics, and screenshots
      description: Paste a redacted minimal rule, key event, or log, or attach diagnostics, screenshots, or recordings. Do not expose real input content, full device paths, or sensitive window titles.

  - type: textarea
    id: notes
    attributes:
      label: Additional information
      description: Include first affected version, workaround, related issue, or recent device or rule changes.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I reproduced this on the latest release and searched existing issues.
          required: true
        - label: I removed real input content, device identifiers, local paths, and other sensitive information from rules, events, diagnostics, and screenshots.
          required: true
        - label: I read the Raw Input capability boundary; the expected result does not require consuming, replacing, or hiding original Windows input.
          required: true
        - label: This is not an unresolved security vulnerability; those are reported privately.
          required: true
