# 中文缺陷报告表单。
# 必填环境、设备、映射上下文和复现证据用于区分 RuleSpec 错误、Raw Input 边界与界面问题；
# 敏感信息提示放在提交入口，避免公开按键内容、设备路径或应用身份。
name: 报告问题（简体中文）
description: 报告可稳定复现的映射错误、设备误判、CLI 故障或界面异常
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        提交前请升级到最新版本，并先查看 README、安全和能力边界及迁移说明。
        规则、事件和诊断包可能包含按键内容、应用或窗口身份、设备派生标识及本机路径，请在公开前自行脱敏。尚未修复的安全问题请使用私密漏洞报告入口，不要创建公开 Issue。

  - type: input
    id: version
    attributes:
      label: 小助手版本
      description: 可在“关于”、诊断包或发行包的 VERSION 文件中确认。
      placeholder: 例如 0.1.0
    validations:
      required: true

  - type: dropdown
    id: distribution
    attributes:
      label: 运行方式
      options:
        - GitHub Release 完整便携包
        - AutoHotkey 源码
        - 自行编译的 EXE
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows 环境
      description: 请填写 Windows 版本、版本号、系统内部版本和架构。
      placeholder: 例如 Windows 11 24H2（26100.4652）x64
    validations:
      required: true

  - type: input
    id: display
    attributes:
      label: 显示环境
      description: 界面问题必须填写缩放比例、分辨率、显示器数量和问题窗口所在显示器；非界面问题可写“不适用”。
      placeholder: 例如 300% 缩放、3840×2160、单显示器
    validations:
      required: true

  - type: dropdown
    id: affected_area
    attributes:
      label: 问题范围
      options:
        - 键盘来源或映射输出
        - 鼠标来源或映射输出
        - 组合键、序列、长按、重复或计时
        - 设备识别、重绑、移除或系统唤醒
        - 应用、窗口、变量条件或生效范围
        - 录制、规则编辑、导入导出或历史
        - CLI、input-worker、启动、重载或托盘
        - 其他界面、文档或发行包问题
    validations:
      required: true

  - type: textarea
    id: devices
    attributes:
      label: 实体设备环境
      description: 请填写键盘和鼠标数量、连接方式，以及问题是否只发生在某一设备。设备接口路径、序列号和 stable_id 必须脱敏。
      placeholder: 例如：两把 USB 键盘和一只蓝牙鼠标；只在第二把键盘上出现。
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 相关映射与运行上下文
      description: 请说明来源／目标输入、条件或作用域、目标应用及其权限、单进程诊断模式，以及相关非默认设置。可粘贴经过脱敏的最小 RuleSpec 或规则包片段。
      placeholder: 例如：设备 A 的 LCtrl 长按映射到 F23；仅在普通权限的目标应用中生效；默认双进程模式。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 最短复现步骤
      description: 请从启动小助手或打开相关窗口开始，提供能够稳定复现的最短操作顺序。
      placeholder: |
        1. 启动……
        2. 选择或录制……
        3. 在设备……上输入……
        4. 观察到……
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: 出现频率
      options:
        - 每次都出现
        - 经常出现
        - 偶尔出现
        - 只出现过一次
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际表现
      description: 请描述输入、附加输出、设备状态、界面、错误信息、进程或数据变化，不要只写“不能用”。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期表现
      description: 请描述在项目已声明的 Raw Input 能力边界内，正确情况下应当看到的状态或结果。
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 规则、事件、诊断包和截图
      description: 请粘贴经过脱敏的最小规则、关键事件或日志，或拖入诊断包、截图和录屏。不要公开真实按键内容、完整设备路径或敏感窗口标题。

  - type: textarea
    id: notes
    attributes:
      label: 补充信息
      description: 可填写首次出现版本、临时解决办法、相关 Issue、最近的设备或规则变化。

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已确认问题在最新版本中仍然存在，并搜索过现有 Issue。
          required: true
        - label: 我已删除规则、事件、诊断包和截图中的真实按键内容、设备标识、本机路径及其他敏感信息。
          required: true
        - label: 我已阅读 Raw Input 能力边界，预期结果不是要求小助手吞掉、替换或隐藏 Windows 原输入。
          required: true
        - label: 这不是尚未修复的安全漏洞；安全问题将通过私密报告入口提交。
          required: true
