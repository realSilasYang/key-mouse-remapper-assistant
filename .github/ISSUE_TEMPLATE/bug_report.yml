name: Bug 报告
description: 报告可以稳定复现的错误
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: 实际行为与预期行为
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows、DPI、AutoHotkey 与项目版本
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 错误信息或最小规则代码块
