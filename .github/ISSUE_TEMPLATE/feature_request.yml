# 中文新功能建议表单。
# 表单要求从真实设备、输入场景和完整工作流说明尚不存在的能力，并将既有行为微调分流到改进建议。
name: 功能建议（简体中文）
description: 提议当前尚不存在的新映射能力或完整工作流
title: "[FEATURE] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        新功能应从真实使用场景出发。对已有映射行为、界面或性能的优化，请改用“改进建议”模板。
        Raw Input 只能识别物理设备并产生附加输出，不能吞掉、替换或隐藏 Windows 原输入。

  - type: textarea
    id: summary
    attributes:
      label: 功能概述
      description: 请用一段话说明希望新增什么能力。
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与当前问题
      description: 请说明谁会使用、涉及哪些实体设备和目标应用，以及现有映射、RuleSpec 或 CLI 为什么无法解决。
    validations:
      required: true

  - type: textarea
    id: workflow
    attributes:
      label: 期望工作流
      description: 请按实际操作顺序描述入口、录制或配置、设备选择、条件、结果、取消和失败处理。
      placeholder: |
        1. 用户从……进入
        2. 选择设备并录制或填写……
        3. 在条件……满足时，小助手应当……
        4. 如果设备断开或规则失败，则……
    validations:
      required: true

  - type: textarea
    id: input_scope
    attributes:
      label: 输入、设备与作用域
      description: 请说明涉及键盘、鼠标、组合／序列／长按中的哪些输入，是否按设备区分，以及适用的应用、窗口、变量或权限范围。
    validations:
      required: true

  - type: textarea
    id: edge_cases
    attributes:
      label: 边界情况
      description: 请覆盖设备移除／重绑、系统唤醒、重复输入、并发规则、挂起、重载、目标应用退出和权限不一致等相关场景。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 如果已有实现想法，可说明界面、RuleSpec、CLI、输入状态机或兼容方式；这不是必填项。

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 请说明当前采用的临时方法，以及为什么仍需要新功能。

  - type: textarea
    id: compatibility
    attributes:
      label: 兼容性与数据影响
      description: 请说明是否影响现有 RuleSpec v2、入口内映射、规则包、设备 stable_id、输出释放、GUI／input-worker 隔离、CLI 或旧数据迁移。

  - type: textarea
    id: notes
    attributes:
      label: 补充信息或界面参考
      description: 可附参考产品、草图、截图、相关 Issue 或经过脱敏的规则示例。

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，确认没有内容相同的建议。
          required: true
        - label: 我描述的是新的用户能力，而不是已有功能的缺陷或小幅优化。
          required: true
        - label: 此建议不依赖 Raw Input 无法提供的原输入抑制、内核驱动、安全桌面或跨用户会话能力。
          required: true
