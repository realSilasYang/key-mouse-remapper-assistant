name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - name: Validate tag
        shell: pwsh
        run: |
          $version = (Get-Content ./VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION $version."
          }

      - name: Resolve locked toolchain
        id: toolchain
        shell: pwsh
        run: |
          $tools = ./tools/bootstrap-toolchain.ps1
          "ahk=$($tools.AutoHotkeyPath)" >> $env:GITHUB_OUTPUT
          "compiler=$($tools.CompilerPath)" >> $env:GITHUB_OUTPUT
          "ahk_source=$($tools.AutoHotkeySourcePath)" >> $env:GITHUB_OUTPUT

      - name: Verify
        shell: pwsh
        run: >-
          ./tests/verify.ps1 -AllowDesktopInput
          -AutoHotkeyPath '${{ steps.toolchain.outputs.ahk }}'

      - name: Verify reproducible release
        shell: pwsh
        run: >-
          ./tests/reproducible-build.ps1
          -AutoHotkeyPath '${{ steps.toolchain.outputs.ahk }}'
          -CompilerPath '${{ steps.toolchain.outputs.compiler }}'
          -AutoHotkeySourcePath '${{ steps.toolchain.outputs.ahk_source }}'

      - name: Build release
        shell: pwsh
        run: >-
          ./tools/build-release.ps1
          -AutoHotkeyPath '${{ steps.toolchain.outputs.ahk }}'
          -CompilerPath '${{ steps.toolchain.outputs.compiler }}'
          -AutoHotkeySourcePath '${{ steps.toolchain.outputs.ahk_source }}'

      - name: Validate release artifacts
        shell: pwsh
        run: ./tests/release-artifact-tests.ps1 -OutputRoot ./dist

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
